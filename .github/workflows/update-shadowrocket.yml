name: Update TailRocket profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: tailrocket-profile-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test and rebuild all upstream profiles
        env:
          PAGES_BASE: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          echo "Running TailRocket unit tests..."
          python -m unittest discover -s tests -v
          echo "Discovering the upstream release profile set and rebuilding atomically..."
          python scripts/build_profiles.py \
            --manifest profiles.json \
            --rules custom_rules.conf \
            --output-dir profiles \
            --alias-output sr_top500_custom.conf \
            --pages-base "$PAGES_BASE"

      - name: Commit only when generated profiles changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- profiles sr_top500_custom.conf; then
            echo "No generated profile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profiles sr_top500_custom.conf
          git commit -m "chore: update TailRocket profiles"
          git push origin "HEAD:${DEFAULT_BRANCH}"
