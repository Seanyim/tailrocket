name: Update Shadowrocket custom config

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: shadowrocket-custom-config
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test and rebuild complete config
        env:
          UPSTREAM_URL: "https://raw.githubusercontent.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever/release/sr_top500_banlist.conf"
          UPDATE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/sr_top500_custom.conf"
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python scripts/build_config.py \
            --upstream "$UPSTREAM_URL" \
            --rules custom_rules.conf \
            --output sr_top500_custom.conf \
            --update-url "$UPDATE_URL"

      - name: Commit only when generated config changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- sr_top500_custom.conf; then
            echo "No generated config changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sr_top500_custom.conf
          git commit -m "chore: update Shadowrocket custom config"
          git push origin "HEAD:${DEFAULT_BRANCH}"
